name: Shard Timings

# Temporary workflow. Runs the browser suite once with --update-shards so Pest
# can measure how long each test class takes, then uploads the resulting
# tests/.pest/shards.json as an artifact. Generated here rather than locally
# because Pest only writes the file when every test passes, and the browser
# suite is only fully green on the runner.
#
# Delete once the timings file is committed.

on:
  push:
    branches:
      - 4.x
    paths:
      - '.github/workflows/shards-timings.yml'
  workflow_dispatch:

jobs:
  timings:
    runs-on: ubuntu-latest

    name: Measure browser suite timings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Node Dependencies
        run: |
          npm install
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          tools: composer:v2
          coverage: none

      - name: Install Composer
        run: |
          composer require "laravel/framework:13.*" --no-interaction --no-progress --ansi --no-update
          composer update --prefer-dist --no-interaction --no-progress --ansi
          composer require livewire/livewire:^4.3 --no-interaction --no-progress --ansi

      - name: Setup Google Chrome
        run: vendor/bin/dusk-updater detect --auto-update

      - name: Clear Orchestra Cache
        run: ./vendor/bin/testbench view:clear

      - name: Measure timings
        run: ./vendor/bin/pest --testsuite=Browser --update-shards
        env:
          CI: true

      - name: Show what was produced
        run: |
          echo "--- tests/.pest/shards.json ---"
          wc -c tests/.pest/shards.json
          head -c 600 tests/.pest/shards.json

      - name: Upload timings
        uses: actions/upload-artifact@v4
        with:
          name: shards-json
          if-no-files-found: error
          retention-days: 3
          path: tests/.pest/shards.json
