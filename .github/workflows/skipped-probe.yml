name: Skipped Probe

# Temporary diagnostic workflow. Runs the browser tests that are normally
# skipped on GitHub Actions, with the skip guards stripped at runtime, and
# uploads screenshots, console logs and page source so the failures can be
# inspected. Manual dispatch only — it never runs on push or pull request.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    name: Probe skipped browser tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Node Dependencies
        run: |
          npm install
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          tools: composer:v2
          coverage: none

      - name: Install Composer
        run: |
          composer require "laravel/framework:13.*" --no-interaction --no-progress --ansi --no-update
          composer update --prefer-dist --no-interaction --no-progress --ansi
          composer require livewire/livewire:^4.3 --no-interaction --no-progress --ansi

      - name: Strip the skip guards
        run: |
          grep -rl 'this->skipOnGitHubActions' src/ \
            | xargs sed -i 's/^\s*\$this->skipOnGitHubActions(.*);\s*$//'
          echo "Remaining guards (expected 0):"
          grep -rc 'this->skipOnGitHubActions' src/ || true

      - name: Setup Google Chrome
        run: vendor/bin/dusk-updater detect --auto-update

      - name: Report environment
        run: |
          echo "chrome: $(google-chrome --version 2>/dev/null || echo n/a)"
          echo "screen: ${SCREEN:-none}"
          echo "DISPLAY=${DISPLAY:-unset}"
          php -r 'echo "php: ".PHP_VERSION."\n";'

      - name: Clear Orchestra Cache
        run: ./vendor/bin/testbench view:clear

      - name: Carousel (whole file is skipped in CI)
        continue-on-error: true
        run: ./vendor/bin/pest src/Components/Carousel/BrowserTest.php
        env:
          CI: true

      - name: The seven individually skipped tests
        continue-on-error: true
        run: |
          ./vendor/bin/pest \
            --filter='can_open_and_select_first_color_in_mode_custom|can_increase$|can_increase_with_live_entangle|can_interact_with_multiples_selects|can_input_decimal_with_comma_on_mobile|can_dispatch_dismissed_event|cannot_close_persistent_interaction_dialog_by_clicking_outside'
        env:
          CI: true

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-artifacts
          if-no-files-found: warn
          retention-days: 7
          path: |
            tests/Browser/screenshots/
            tests/Browser/console/
            tests/Browser/source/
